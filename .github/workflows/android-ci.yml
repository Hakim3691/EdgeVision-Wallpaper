name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  python-tests:
    name: Python detector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run host-side detector tests
        run: python -m unittest discover -s tools/tests -v

  jvm-and-ui-tests:
    name: JVM unit and Robolectric Espresso tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Provision pinned model and Gradle wrapper
        run: bash tools/bootstrap.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit and UI tests
        run: bash ./gradlew :app:testDebugUnitTest --configuration-cache --stacktrace

  instrumentation-tests:
    name: Espresso instrumentation (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Provision pinned model and Gradle wrapper
        run: bash tools/bootstrap.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests on API 34
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ./gradlew :app:connectedDebugAndroidTest -PincludeX86Abi=true --configuration-cache --stacktrace

  build-apks:
    name: Build signed arm64 APKs and enforce size cap
    runs-on: ubuntu-latest
    needs: [python-tests, jvm-and-ui-tests, instrumentation-tests]
    # Release assets are published here, which needs write access to contents.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Provision pinned model and Gradle wrapper
        run: bash tools/bootstrap.sh
      - uses: gradle/actions/setup-gradle@v4

      - name: Provision debug and release keystores with keytool
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_DIR="$RUNNER_TEMP/edgevision-keystore"
          mkdir -p "$KEYSTORE_DIR"

          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE_DIR/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=EdgeVision Debug,O=EdgeVision,C=US"
          {
            echo "EDGEVISION_DEBUG_STORE_FILE=$KEYSTORE_DIR/debug.keystore"
            echo "EDGEVISION_DEBUG_STORE_PASSWORD=android"
            echo "EDGEVISION_DEBUG_KEY_ALIAS=androiddebugkey"
            echo "EDGEVISION_DEBUG_KEY_PASSWORD=android"
          } >> "$GITHUB_ENV"

          if [[ -n "${KEYSTORE_BASE64:-}" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_DIR/release.keystore"
            : "${KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is required with a keystore}"
            : "${KEY_ALIAS:?ANDROID_KEY_ALIAS is required with a keystore}"
            : "${KEY_PASSWORD:?ANDROID_KEY_PASSWORD is required with a keystore}"
            {
              echo "EDGEVISION_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "EDGEVISION_RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "EDGEVISION_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Using the repository release keystore."
          else
            RELEASE_PASSWORD="$(openssl rand -hex 16)"
            echo "::add-mask::$RELEASE_PASSWORD"
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE_DIR/release.keystore" \
              -storepass "$RELEASE_PASSWORD" -keypass "$RELEASE_PASSWORD" \
              -alias edgevision -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=EdgeVision CI,O=EdgeVision,C=US"
            {
              echo "EDGEVISION_RELEASE_STORE_PASSWORD=$RELEASE_PASSWORD"
              echo "EDGEVISION_RELEASE_KEY_ALIAS=edgevision"
              echo "EDGEVISION_RELEASE_KEY_PASSWORD=$RELEASE_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret configured; signed with an ephemeral CI key."
          fi
          echo "EDGEVISION_RELEASE_STORE_FILE=$KEYSTORE_DIR/release.keystore" >> "$GITHUB_ENV"

      - name: Assemble debug and release APKs
        run: >-
          bash ./gradlew :app:assembleDebug :app:assembleRelease
          --configuration-cache --build-cache --stacktrace

      - name: Enforce 40 MB APK cap and arm64-only release
        run: |
          bash scripts/check_apk_size.sh \
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk \
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if unzip -Z1 app/build/outputs/apk/release/app-arm64-v8a-release.apk | grep -q '^lib/'; then
            if unzip -Z1 app/build/outputs/apk/release/app-arm64-v8a-release.apk | grep -qE '^lib/(x86|x86_64|armeabi-v7a)/'; then
              echo "::error::Release APK contains a non-arm64 ABI"
              exit 1
            fi
          fi

      # APK delivery uses GitHub Release assets rather than Actions artifacts.
      # Action artifact storage is a small account-wide quota that other
      # repositories in this account routinely exhaust, which blocked this
      # job's uploads. Release assets are repository storage with their own
      # limits, so publishing here is independent of that quota. Asset names
      # stay exactly app-arm64-v8a-debug.apk and app-arm64-v8a-release.apk.
      - name: Publish APKs to the rolling CI release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ci-latest
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          DEBUG_APK=app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          RELEASE_APK=app/build/outputs/apk/release/app-arm64-v8a-release.apk
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"

          debug_bytes=$(stat -c %s "$DEBUG_APK")
          release_bytes=$(stat -c %s "$RELEASE_APK")
          debug_sha=$(sha256sum "$DEBUG_APK" | cut -d' ' -f1)
          release_sha=$(sha256sum "$RELEASE_APK" | cut -d' ' -f1)
          # The body names the commit, the run and the exact bytes it holds, so a
          # release never describes an older build than the APKs it carries.
          notes=$(printf '%s\n' \
            "Signed arm64-v8a APKs built from ${COMMIT_SHA} by workflow run ${GITHUB_RUN_NUMBER}." \
            "" \
            "- app-arm64-v8a-debug.apk - ${debug_bytes} bytes, sha256 ${debug_sha}" \
            "- app-arm64-v8a-release.apk - ${release_bytes} bytes, sha256 ${release_sha}")

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Updating existing release $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              --title "Edge Vision CI build" \
              --notes "$notes" \
              --target "$COMMIT_SHA"
          fi

          # gh names each asset after its file basename, so the published
          # assets are app-arm64-v8a-debug.apk and app-arm64-v8a-release.apk.
          gh release upload "$RELEASE_TAG" "$DEBUG_APK" "$RELEASE_APK" --clobber

          # Keep the rolling release attached to the commit that produced it,
          # otherwise the Releases page still points at the first build.
          gh release edit "$RELEASE_TAG" --target "$COMMIT_SHA" --notes "$notes"

          # Also publish a versioned release, so finished work produces a
          # discoverable release entry with both APKs attached instead of only
          # a single rolling tag. The tag follows versionName in
          # app/build.gradle.kts: bump it to cut a new release.
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          VERSION_TAG="v${VERSION_NAME}"
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            echo "Updating existing release $VERSION_TAG"
          else
            gh release create "$VERSION_TAG" \
              --title "Edge Vision v${VERSION_NAME}" \
              --notes "$notes" \
              --target "$COMMIT_SHA"
          fi
          gh release upload "$VERSION_TAG" "$DEBUG_APK" "$RELEASE_APK" --clobber

          # Refreshing the assets also refreshes the description and target commit,
          # so the versioned release always describes the build it holds.
          gh release edit "$VERSION_TAG" \
            --title "Edge Vision v${VERSION_NAME}" \
            --target "$COMMIT_SHA" \
            --notes "$notes"

          for TAG in "$RELEASE_TAG" "$VERSION_TAG"; do
            echo "--- $TAG"
            gh release view "$TAG" --json assets \
              --jq '.assets[] | "\(.name)\t\(.size) bytes"'
          done
